apiVersion: apps/v1
kind: Deployment
metadata:
  name: tke-test  # 与GitHub Actions中的DEPLOYMENT_NAME保持一致
  labels:
    app: mywebapp
spec:
  replicas: 2  # 部署2个副本
  selector:
    matchLabels:
      app: mywebapp
  template:
    metadata:
      labels:
        app: mywebapp
    spec:
      containers:
      - name: mywebapp
        image: ccr.ccs.tencentyun.com/demo/mywebapp:latest  # 这个会被kustomize自动替换为实际的镜像版本
        ports:
        - containerPort: 80
        resources:
          limits:
            cpu: "1"
            memory: "512Mi"
          requests:
            cpu: "0.5"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5